[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed = 460800

; Optional build flags (enable debug logs if needed)
build_flags = -DCORE_DEBUG_LEVEL=ARDUHAL_LOG_LEVEL_DEBUG

; If you want PlatformIO to fetch additional libraries, add them here.
; lib_deps = 
;  ArduinoJson
;  MIDI
